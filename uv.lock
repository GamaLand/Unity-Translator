[[package]]
name = "unitytranslator"
version = "0.5.0"
source = { editable = "." }
dependencies = [
    { name = "dnfile" },
    { name = "httpx" },
    { name = "pydantic" },
    { name = "unitypy" },
]

[package.optional-dependencies]
ui = [
    { name = "pyside6" },
]

[package.dev-dependencies]
build = [
    { name = "nuitka" },
]
dev = [
    { name = "dncil" },
    { name = "fonttools" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "dnfile", specifier = ">=0.17,<0.18" },
    { name = "httpx", specifier = ">=0.28,<0.29" },
    { name = "pydantic", specifier = ">=2.10,<3" },
    { name = "pyside6", marker = "extra == 'ui'", specifier = ">=6.8,<7" },
    { name = "unitypy", specifier = ">=1.20,<2" },
]
provides-extras = ["ui"]

[package.metadata.requires-dev]
build = [{ name = "nuitka", specifier = "==4.1.1" }]
dev = [
    { name = "dncil", specifier = "==1.0.2" },
    { name = "fonttools", specifier = ">=4.60,<5" },
    { name = "mypy", specifier = ">=1.14,<2" },
    { name = "pytest", specifier = ">=8,<10" },
    { name = "ruff", specifier = ">=0.9,<1" },
]
